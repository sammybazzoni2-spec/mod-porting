name: Build OooCraft (1.12.2)

on:
  push:
    paths: ['OooCraft-1.12.2/**', '.github/workflows/build-oooCraft.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      # Forge's maven no longer serves the 1.12.2 userdev jar that ForgeGradle 2/3 need,
      # so build inside the maintained RetroFuturaGradle 1.12.2 template instead.
      - name: Fetch template
        run: git clone --depth 1 https://github.com/GTNewHorizons/ExampleMod1.12 template

      - name: Overlay OooCraft sources
        run: |
          cd template
          rm -rf src/main/java src/main/resources
          mkdir -p src/main
          cp -r ../OooCraft-1.12.2/src/main/java src/main/java
          cp -r ../OooCraft-1.12.2/src/main/resources src/main/resources
          echo "--- template gradle.properties ---"
          cat gradle.properties
          sed -i -E 's/^modName *=.*/modName = OooCraft/; s/^modId *=.*/modId = ooocraft/; s/^modGroup *=.*/modGroup = com.thecramp/' gradle.properties

      - name: Build
        working-directory: template
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OooCraft-jar
          path: template/build/libs/*.jar
          if-no-files-found: warn
