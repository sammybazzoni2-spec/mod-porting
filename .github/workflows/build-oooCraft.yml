name: Build OooCraft (1.12.2)

on:
  push:
    paths: ['OooCraft-1.12.2/**', '.github/workflows/build-oooCraft.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Forge's maven no longer serves the 1.12.2 userdev jar that ForgeGradle 2/3 need,
      # so build inside the maintained RetroFuturaGradle 1.12.2 template (CleanroomMC/TemplateDevEnv) instead.
      - name: Fetch template
        run: git clone --depth 1 https://github.com/CleanroomMC/TemplateDevEnv template

      - name: Overlay OooCraft sources
        run: |
          cd template
          echo "--- template tree ---"; find . -path ./.git -prune -o -type f -not -path './src/main/resources/assets/*' -print | head -60
          rm -rf src/main/java src/main/resources
          mkdir -p src/main
          cp -r ../OooCraft-1.12.2/src/main/java src/main/java
          cp -r ../OooCraft-1.12.2/src/main/resources src/main/resources
          echo "--- template gradle.properties ---"
          cat gradle.properties
          sed -i -E 's/^mod_id *=.*/mod_id = ooocraft/; s/^mod_name *=.*/mod_name = OooCraft/; s/^root_package *=.*/root_package = com.thecramp/; s/^mod_version *=.*/mod_version = 0.2/; s/^mod_authors *=.*/mod_authors = TheCramp/' gradle.properties
          sed -i 's/\${version}/0.2/; s/\${mcversion}/1.12.2/' src/main/resources/mcmod.info
          echo "--- patched gradle.properties ---"; cat gradle.properties

      - name: Build
        working-directory: template
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OooCraft-jar
          path: template/build/libs/*.jar
          if-no-files-found: warn
